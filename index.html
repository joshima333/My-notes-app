<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'">
<meta name="theme-color" content="#c9d6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Note Vocali</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="hello">
    <h1 id="hello">Ciao 👋</h1>
    <div id="today" class="today"></div>
  </div>
  <button id="weather" class="weather" type="button" aria-label="Meteo"></button>
  <button id="btnSettings" class="icon" aria-label="Impostazioni">⚙️</button>
</header>

<main>
  <section id="recorder" class="card">
    <div id="chips" class="chips" role="radiogroup" aria-label="Raccolta"></div>
    <button id="btnRec" class="rec">● Registra</button>
    <div id="timer" class="muted">00:00</div>
    <div id="live" class="live"></div>
    <p id="status" class="status hidden"></p>
  </section>

  <section id="home">
    <input id="search" type="search" placeholder="Cerca in tutte le note…">
    <div class="sectionhead"><h2>Raccolte</h2><span id="syncIcon" class="syncpill hidden"></span></div>
    <div id="folders" class="folders"></div>
    <ul id="results" class="notes hidden"></ul>
  </section>

  <section id="folderView" class="hidden">
    <div class="folderhead">
      <button id="btnBack" class="back">‹ Raccolte</button>
      <h2 id="folderTitle"></h2>
    </div>
    <ul id="notes" class="notes"></ul>
  </section>
</main>

<div id="toast" class="toast hidden" role="status">Nota eliminata <button type="button" id="btnUndo">Annulla</button></div>

<dialog id="noteDlg">
  <form method="dialog" class="dlg">
    <input id="noteTitle" placeholder="Titolo">
    <select id="noteCat"></select>
    <audio id="noteAudio" controls class="hidden"></audio>
    <button type="button" id="btnLoadAudio" class="hidden">🔊 Scarica audio</button>
    <div id="eventBox" class="eventbox hidden">
      <div class="evtitle">📅 <b id="evTitle"></b></div>
      <div id="evWhen" class="muted small"></div>
      <div class="row left">
        <button type="button" data-cal="google">Google</button>
        <button type="button" data-cal="outlook">Outlook</button>
        <button type="button" data-cal="apple">Apple</button>
      </div>
    </div>
    <ul id="checklist" class="checklist hidden"></ul>
    <div class="addrow">
      <input id="addItem" form="addItemForm" placeholder="Aggiungi…" enterkeyhint="done">
      <button type="submit" form="addItemForm" class="addbtn" aria-label="Aggiungi">＋</button>
    </div>
    <button type="button" id="btnAppendRec" class="appendrec">🎙️ Aggiungi a voce</button>
    <div id="appendLive" class="live appendlive hidden"></div>
    <textarea id="noteText" rows="8"></textarea>
    <div class="row">
      <button type="button" id="btnRetry" class="hidden">🔁 Riprova trascrizione</button>
      <button type="button" id="btnCopy">📋 Copia</button>
      <button type="button" id="btnShare">📤 Condividi</button>
      <button type="button" id="btnDownload">⬇️ .txt</button>
    </div>
    <div class="row">
      <button type="button" id="btnDelete" class="danger">🗑️ Elimina</button>
      <button type="button" id="btnSave" class="primary">Salva</button>
    </div>
  </form>
</dialog>

<form id="addItemForm" hidden></form>

<dialog id="settingsDlg">
  <form method="dialog" class="dlg">
    <h2>Impostazioni</h2>
    <label>Il tuo nome
      <input id="nameInput" placeholder="Es. Jovana" autocomplete="given-name">
    </label>
    <div id="accountBox" class="summary small hidden">
      <div>👤 <b id="accountEmail"></b></div>
      <div id="syncText" class="muted"></div>
    </div>
    <p id="privacyInfo" class="summary small"></p>
    <label id="modelRow">Qualità trascrizione sul telefono
      <select id="model">
        <option value="Xenova/whisper-small">Alta (~250 MB, più lenta)</option>
        <option value="Xenova/whisper-base">Veloce (~80 MB, meno precisa)</option>
      </select>
    </label>
    <label>Raccolte (una per riga)
      <textarea id="catsInput" rows="6"></textarea>
    </label>
    <button type="button" id="btnFaceIdSetup">🙂 Attiva Face ID</button>
    <button type="button" id="btnPin">🔒 Cambia PIN</button>
    <button type="button" id="btnLogout" class="danger hidden">Esci dall'account</button>
    <div class="row"><button id="btnSaveSettings" class="primary">Salva</button></div>
  </form>
</dialog>

<div id="lock" class="lock hidden">
  <form id="authForm" class="card lockcard hidden">
    <div class="lockicon">☁️</div>
    <p id="authMsg">Accedi per ritrovare le tue note su ogni dispositivo</p>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="username" required>
    <input id="authPass" type="password" placeholder="Password" autocomplete="current-password" required minlength="6">
    <button class="primary" id="btnLogin">Accedi</button>
    <button type="button" id="btnSignup">Crea account</button>
    <p class="muted small">🔐 Le note sono cifrate con la tua password: se la dimentichi non si possono recuperare.</p>
  </form>
  <form id="lockForm" class="card lockcard hidden">
    <div class="lockicon">🔒</div>
    <p id="lockMsg">Inserisci il PIN</p>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <button class="primary">Sblocca</button>
    <button type="button" id="btnFaceId" class="hidden">🙂 Usa Face ID</button>
  </form>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="db.js"></script>
<script src="smart.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
